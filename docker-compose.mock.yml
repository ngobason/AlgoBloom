services:
  prism-mock:
    image: stoplight/prism:4
    container_name: algobloom-prism-mock
    command: mock -h 0.0.0.0 -p 4010 --cors /contracts/openapi.yaml
    ports:
      - "4010:4010"
    volumes:
      - ./contracts/openapi.yaml:/contracts/openapi.yaml:ro
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: algobloom-swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /contracts/openapi.yaml
      TRY_IT_OUT_ENABLED: "true"
      PERSIST_AUTHORIZATION: "true"
    volumes:
      - ./contracts/openapi.yaml:/contracts/openapi.yaml:ro
    depends_on:
      - prism-mock
    restart: unless-stopped
